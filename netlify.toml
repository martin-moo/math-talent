# Netlify configuration — Akram Zakine · Mathematical Portfolio
# Static build settings only. Forms are detected at build time from the
# data-netlify attribute on the contact form; Identity + Git Gateway are
# enabled in the Netlify UI (site settings) — no config needed here.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # SPEC §12: Node >= 20
  NODE_VERSION = "20"
